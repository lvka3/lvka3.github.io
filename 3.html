<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>服务器维护公告</title>
    <style>
        @font-face {
            font-family: 'Times New Roman';
            src: url('Times New Roman.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg: #f0f6fc;
            --gradient-mid: #e6f0f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.6);
            --text-primary: #1a2a3a;
            --text-secondary: #3a4a5a;
            --text-muted: #6a7a8a;
            --accent: #3b82c4;
            --accent-soft: rgba(59, 130, 196, 0.12);
            --border: #dce6f0;
            --shadow-card: 0 15px 30px rgba(0, 0, 0, 0.06);
            --shadow-banner: 0 1px 8px rgba(0,0,0,0.04);
            --banner-bg: rgba(245, 250, 255, 0.75);
            --banner-border: rgba(180, 210, 240, 0.6);
            --banner-text: #2a4a6a;
            --contact-text: #3a4a5a;
            --contact-link: #1a4a8a;
            --footer-text: #7a8a9a;
            --drawer-bg: rgba(255,255,255,0.92);
            --drawer-border: rgba(0,0,0,0.06);
            --drawer-btn-hover: #f0f5fa;
            --drawer-btn-border-hover: #c0d0e0;
            --modal-bg: rgba(255,255,255,0.94);
            --modal-row-border: rgba(0,0,0,0.04);
            --toast-bg: #1a2a3a;
            --toast-text: #f0f6fc;
            --info-item-border: rgba(0,0,0,0.04);
            --divider: #d0dce8;
            --empty-value: #a0b0c0;
            --fab-lang-bg: rgba(59, 130, 196, 0.9);
            --fab-detail-bg: rgba(26, 42, 58, 0.9);
            --particle-color: rgba(59, 130, 196, 0.16);
            --gradient-start: #e8f2fc;
            --gradient-end: #dce8f4;
            --circle1-color: rgba(59, 130, 196, 0.06);
            --circle2-color: rgba(90, 150, 220, 0.05);
            --circle3-color: rgba(59, 130, 196, 0.04);
            --loading-bg: #e8f2fc;
            --loading-text: #2a4a6a;
            --progress-bg: #c8d8e8;
            --progress-fill: #3b82c4;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121a24;
                --gradient-mid: #1a2430;
                --card-bg: rgba(25, 35, 50, 0.85);
                --card-border: rgba(255, 255, 255, 0.08);
                --text-primary: #e0e8f0;
                --text-secondary: #b0c0d0;
                --text-muted: #708090;
                --accent: #5ba0f5;
                --accent-soft: rgba(91, 160, 245, 0.15);
                --border: #2a3a4a;
                --shadow-card: 0 15px 30px rgba(0, 0, 0, 0.3);
                --shadow-banner: 0 1px 8px rgba(0,0,0,0.2);
                --banner-bg: rgba(20, 30, 45, 0.8);
                --banner-border: rgba(90, 150, 220, 0.3);
                --banner-text: #a0c0e0;
                --contact-text: #b0c0d0;
                --contact-link: #8ab0f0;
                --footer-text: #607080;
                --drawer-bg: rgba(20, 25, 35, 0.95);
                --drawer-border: rgba(255,255,255,0.06);
                --drawer-btn-hover: #223040;
                --drawer-btn-border-hover: #2a3a4a;
                --modal-bg: rgba(20, 25, 35, 0.95);
                --modal-row-border: rgba(255,255,255,0.06);
                --toast-bg: #1a2a3a;
                --toast-text: #e0e8f0;
                --info-item-border: rgba(255,255,255,0.05);
                --divider: #2a3a4a;
                --empty-value: #506070;
                --fab-lang-bg: rgba(91, 160, 245, 0.9);
                --fab-detail-bg: rgba(15, 25, 40, 0.9);
                --particle-color: rgba(91, 160, 245, 0.18);
                --gradient-start: #151f2a;
                --gradient-end: #101820;
                --circle1-color: rgba(91, 160, 245, 0.08);
                --circle2-color: rgba(100, 170, 240, 0.06);
                --circle3-color: rgba(91, 160, 245, 0.06);
                --loading-bg: #151f2a;
                --loading-text: #a0c0e0;
                --progress-bg: #2a3a4a;
                --progress-fill: #5ba0f5;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Times New Roman', sans-serif;
            font-weight: 600;
            background: radial-gradient(circle at 30% 10%, var(--gradient-start) 0%, var(--gradient-mid) 60%, var(--gradient-end) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .bg-decoration { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
        .circle-1 { width: 600px; height: 600px; background: radial-gradient(circle, var(--circle1-color) 0%, transparent 70%); top: -250px; right: -200px; }
        .circle-2 { width: 500px; height: 500px; background: radial-gradient(circle, var(--circle2-color) 0%, transparent 70%); bottom: -240px; left: -160px; }
        .circle-3 { width: 350px; height: 350px; background: radial-gradient(circle, var(--circle3-color) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); animation: float 8s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.08); } }

        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .particle { position: absolute; background: var(--particle-color); border-radius: 50%; animation: rise 10s infinite; bottom: -40px; }
        .particle:nth-child(1) { left: 10%; width: 5px; height: 5px; animation-duration: 9s; }
        .particle:nth-child(2) { left: 25%; width: 7px; height: 7px; animation-duration: 12s; animation-delay: 2s; }
        .particle:nth-child(3) { left: 45%; width: 4px; height: 4px; animation-duration: 8s; animation-delay: 4s; }
        .particle:nth-child(4) { left: 65%; width: 8px; height: 8px; animation-duration: 11s; animation-delay: 1s; }
        .particle:nth-child(5) { left: 80%; width: 6px; height: 6px; animation-duration: 10s; animation-delay: 3s; }
        @keyframes rise { 0% { transform: translateY(0) scale(0); opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.6; } 100% { transform: translateY(-110vh) scale(1.3); opacity: 0; } }

        #loadingOverlay {
            position: fixed; inset: 0; background: var(--loading-bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 1rem; font-weight: 600; color: var(--loading-text); letter-spacing: 0.05em; gap: 24px;
        }
        #loadingError { display: none; text-align: center; color: #d44; }
        .progress-container { width: 200px; height: 6px; background: var(--progress-bg); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--progress-fill); transition: width 0.3s; }

        .page-wrapper { position: relative; z-index: 2; width: 100%; max-width: 580px; animation: fadeInUp 0.5s ease-out; display: none; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .update-banner {
            background: var(--banner-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--banner-border); border-left: 4px solid var(--accent);
            border-radius: 10px; padding: 10px 16px; margin-bottom: 12px;
            font-size: 0.82rem; color: var(--banner-text); box-shadow: var(--shadow-banner);
            display: flex; align-items: center; gap: 10px;
            overflow: hidden; white-space: nowrap;
        }
        .banner-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 0 4px rgba(59,130,196,0.15); flex-shrink: 0; }
        .banner-text-container { overflow: hidden; flex: 1; }
        .banner-text-inner { display: inline-block; animation: scrollBanner 12s linear infinite; padding-left: 100%; }
        @keyframes scrollBanner { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        .main-card { background: var(--card-bg); backdrop-filter: blur(18px); border-radius: 22px; box-shadow: var(--shadow-card); overflow: hidden; border: 1px solid var(--card-border); }
        .card-accent-bar { height: 3px; background: linear-gradient(90deg, var(--accent) 0%, #5ba0f5 50%, var(--accent) 100%); }
        .card-body { padding: 24px 28px 22px; }

        .header-section { text-align: center; margin-bottom: 20px; }
        .main-title { font-size: 1.5rem; font-weight: 700; }

        .info-list { list-style: none; }
        .info-item { padding: 12px 10px; transition: background 0.2s; }
        .info-item:hover { background: rgba(0,0,0,0.02); }
        .info-item:active { background: transparent; }
        .info-item+.info-item { border-top: 1px solid var(--info-item-border); }
        .info-item-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
        .info-item-value { font-size: 0.92rem; font-weight: 600; word-break: break-word; }
        .empty-value { color: var(--empty-value); font-style: italic; font-weight: 500; }

        .contact-section { text-align: center; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--info-item-border); font-size: 0.88rem; color: var(--contact-text); }
        .contact-link { color: var(--contact-link); text-decoration: underline; cursor: pointer; font-weight: 700; }
        .contact-link:hover { color: var(--accent); }

        .footer-note { text-align: center; margin-top: 20px; font-size: 0.65rem; color: var(--footer-text); letter-spacing: 0.04em; }

        .lang-fab, .detail-fab {
            position: fixed; bottom: 24px; z-index: 1001; height: 46px; padding: 0 22px; border-radius: 40px;
            border: none; cursor: pointer; font-weight: 700; font-size: 0.88rem; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 8px 22px rgba(0,0,0,0.15); transition: all 0.25s; white-space: nowrap;
            backdrop-filter: blur(8px); font-family: inherit; color: #fff;
        }
        .lang-fab { right: 24px; background: var(--fab-lang-bg); }
        .lang-fab:hover { background: #2a6cb0; transform: translateY(-2px); }
        .detail-fab { left: 24px; background: var(--fab-detail-bg); }
        .detail-fab:hover { background: #0f1a26; transform: translateY(-2px); }

        .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); backdrop-filter: blur(6px); z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.25s; display: flex; justify-content: flex-end; }
        .drawer-overlay.active { opacity: 1; pointer-events: auto; }
        .drawer-panel { width: 260px; max-width: 85vw; height: 100%; background: var(--drawer-bg); backdrop-filter: blur(16px); box-shadow: -8px 0 30px rgba(0,0,0,0.12); transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; }
        .drawer-overlay.active .drawer-panel { transform: translateX(0); }
        .drawer-header { padding: 20px 22px 14px; border-bottom: 1px solid var(--drawer-border); display: flex; justify-content: space-between; align-items: center; }
        .drawer-title { font-size: 1rem; font-weight: 700; }
        .drawer-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--text-secondary); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: inherit; }
        .drawer-lang-list { list-style: none; flex: 1; overflow-y: auto; padding: 10px 8px; display: flex; flex-direction: column; gap: 4px; }
        .drawer-lang-btn { width: 100%; text-align: left; padding: 12px 18px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; background: transparent; border: 1px solid transparent; cursor: pointer; color: var(--text-primary); transition: all 0.2s; font-family: inherit; }
        .drawer-lang-btn:hover { background: var(--drawer-btn-hover); border-color: var(--drawer-btn-border-hover); }
        .drawer-lang-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); z-index: 3000; opacity: 0; pointer-events: none; transition: opacity 0.25s; display: flex; align-items: center; justify-content: center; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box { background: var(--modal-bg); backdrop-filter: blur(25px); border-radius: 26px; width: 92%; max-width: 480px; max-height: 80vh; overflow-y: auto; box-shadow: 0 30px 60px rgba(0,0,0,0.2); padding: 24px 22px; animation: modalPop 0.25s ease-out; }
        @keyframes modalPop { from { transform: scale(0.93); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .modal-title { font-size: 1.2rem; font-weight: 700; }
        .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: inherit; }
        .info-block { margin-bottom: 20px; }
        .info-block h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 10px; font-weight: 700; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--modal-row-border); font-size: 0.85rem; }
        .info-row span:first-child { color: var(--text-secondary); font-weight: 600; white-space: nowrap; }
        .info-row span:last-child { font-weight: 700; color: var(--text-primary); text-align: right; }

        .toast-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 4000; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
        .toast-overlay.active { opacity: 1; pointer-events: auto; }
        .toast-box { background: var(--toast-bg); color: var(--toast-text); padding: 14px 28px; border-radius: 12px; font-size: 0.88rem; font-weight: 600; text-align: center; max-width: 85vw; box-shadow: 0 20px 50px rgba(0,0,0,0.3); animation: toastIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(18px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .card-body { padding: 20px 18px 18px; }
            .lang-fab, .detail-fab { height: 42px; padding: 0 16px; font-size: 0.8rem; bottom: 18px; }
            .lang-fab { right: 14px; } .detail-fab { left: 14px; }
            .main-title { font-size: 1.4rem; }
            .update-banner { font-size: 0.78rem; padding: 8px 14px; }
            .info-item-value { font-size: 0.85rem; }
            .modal-box { padding: 20px 16px; }
        }
    </style>
</head>
<body>

    <script>

            };

            const langOrder = ['zh-CN'];
            function getLangData(lang) { return i18n[lang] || i18n['zh-CN']; }

            function getDynamicDateStrings() {
                const now = new Date();

            const loadingMessage = $('loadingMessage');
            const progressFill = $('progressFill');
            const progressPercent = $('progressPercent');
            const contactModal = $('contactModal');
            const contactModalClose = $('contactModalClose');

            function buildDrawer() {
                drawerList.innerHTML = '';
                langOrder.forEach(lang => {
                    const d = getLangData(lang);
                    const btn = document.createElement('button');
                    btn.className = 'drawer-lang-btn';
                    btn.dataset.lang = lang;
                    btn.textContent = d.langLabel || lang;
                    btn.onclick = () => {
                        if (lang === currentLang) {
                            showToast(`您当前选择的已经是“${d.langLabel}”了。`);
                            closeDrawer();
                        } else {
                            switchLanguage(lang);
                            closeDrawer();
                        }
                    };
                    drawerList.appendChild(btn);
                });
            }

            function updateUI(lang) {
                const d = getLangData(lang);
                const dynamic = getDynamicDateStrings();
                bannerText.innerHTML = dynamic.bannerStr;
                valueTime.innerHTML = dynamic.timeStr;
                mainTitle.textContent = d.title;
                document.title = d.title;
                document.getElementById('labelTarget').textContent = d.target;
                document.getElementById('labelTime').textContent = d.time;
                document.getElementById('labelImpact').textContent = d.impact;
                document.getElementById('valueImpact').textContent = d.impactVal;
                document.getElementById('labelContent').textContent = d.content;
                document.getElementById('valueContent').textContent = d.dash;
                document.getElementById('labelCompensation').textContent = d.comp;
                document.getElementById('valueCompensation').textContent = d.dash;
                contactSection.innerHTML = d.contact;
                toastBox.textContent = d.toast;
                footerNote.textContent = d.footer;
                drawerTitle.textContent = d.drawerTitle;
                langFab.textContent = d.langBtn || d.drawerTitle;
                detailFab.textContent = d.detailBtn;
                detailTitle.textContent = d.detailTitle;
                devHead.textContent = d.devHead;
                srvHead.textContent = d.srvHead;
                document.documentElement.lang = lang;
                document.documentElement.dir = 'ltr';
                updateDrawerActive(lang);
                rebindContact();
                if (detailModal.classList.contains('active')) renderDetailModal(lang);
            }

            function updateDrawerActive(lang) {
                drawerList.querySelectorAll('.drawer-lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
            }

            function switchLanguage(lang) {
                if (lang === currentLang || !langOrder.includes(lang)) return;
                currentLang = lang;
                updateUI(lang);
                try { localStorage.setItem('preferred-language', lang); } catch(e) {}
            }

            function openDrawer() { drawerOverlay.classList.add('active'); document.body.style.overflow = 'hidden'; }
            function closeDrawer() { drawerOverlay.classList.remove('active'); document.body.style.overflow = ''; }

            function rebindContact() {
                const link = document.getElementById('contactLink');
                if (link) {
                    link.onclick = (e) => {
                        e.preventDefault();
                        contactModal.classList.add('active');
                        document.body.style.overflow = 'hidden';
                    };
                }
            }
            contactModalClose.onclick = () => { contactModal.classList.remove('active'); document.body.style.overflow = ''; };
            contactModal.onclick = (e) => { if (e.target === contactModal) { contactModal.classList.remove('active'); document.body.style.overflow = ''; } };

            function showToast(msg) {
                toastBox.textContent = msg;
                toastOverlay.classList.add('active');
                clearTimeout(toastOverlay._timeout);
                toastOverlay._timeout = setTimeout(() => toastOverlay.classList.remove('active'), 2000);
            }

            function parseUserAgent() {
                const ua = navigator.userAgent || '';
                const data = {};
                data.fullUA = ua;

                if (navigator.userAgentData) {
                    const brands = navigator.userAgentData.brands;
                    if (brands && brands.length) {
                        data.browserName = brands[0].brand;
                        data.browserVersion = brands[0].version;
                    }
                    data.platform = navigator.userAgentData.platform;
                    data.mobile = navigator.userAgentData.mobile ? '移动端' : '桌面端';
                    data.engine = '—';
                } else {
                    const uaLower = ua.toLowerCase();
                    if (uaLower.includes('edg')) { data.browserName = 'Edge'; data.browserVersion = (ua.match(/edg\/([\d.]+)/i) || [])[1] || ''; }
                    else if (uaLower.includes('chrome') && !uaLower.includes('edg')) { data.browserName = 'Chrome'; data.browserVersion = (ua.match(/chrome\/([\d.]+)/i) || [])[1] || ''; }
                    else if (uaLower.includes('safari') && !uaLower.includes('chrome')) { data.browserName = 'Safari'; data.browserVersion = (ua.match(/version\/([\d.]+)/i) || [])[1] || ''; }
                    else if (uaLower.includes('firefox')) { data.browserName = 'Firefox'; data.browserVersion = (ua.match(/firefox\/([\d.]+)/i) || [])[1] || ''; }
                    else { data.browserName = 'Unknown'; data.browserVersion = ''; }

                    if (uaLower.includes('webkit')) { data.engine = 'WebKit'; }
                    else if (uaLower.includes('gecko') && !uaLower.includes('webkit')) { data.engine = 'Gecko'; }
                    else if (uaLower.includes('trident')) { data.engine = 'Trident'; }
                    else { data.engine = '—'; }

                    const osMatch = ua.match(/\(([^)]+)\)/);
                    data.platform = osMatch ? osMatch[1] : (navigator.platform || 'Unknown');
                    data.mobile = /mobile|android|iphone|ipad|ipod/i.test(ua) ? '移动端' : '桌面端';
                }
                return data;
            }

            function renderDetailModal(lang) {
                const d = getLangData(lang);
                const online = navigator.onLine;
                const now = new Date();
                const timeStr = now.getFullYear() + '/' + 
                    (now.getMonth()+1).toString().padStart(2,'0') + '/' + 
                    now.getDate().toString().padStart(2,'0') + ' ' +
                    now.getHours().toString().padStart(2,'0') + ':' +
                    now.getMinutes().toString().padStart(2,'0') + ':' +
                    now.getSeconds().toString().padStart(2,'0');
                const networkType = navigator.connection?.effectiveType ? navigator.connection.effectiveType.toUpperCase() : 'UNKNOWN';
                const uaData = parseUserAgent();

                devContent.innerHTML = `
                    <div class="info-row"><span>${d.browserName}</span><span>${uaData.browserName || '—'}</span></div>
                    <div class="info-row"><span>${d.browserVersion}</span><span>${uaData.browserVersion || '—'}</span></div>
                    <div class="info-row"><span>${d.engine}</span><span>${uaData.engine || '—'}</span></div>
                    <div class="info-row"><span>${d.os}</span><span>${uaData.platform || '—'}</span></div>
                    <div class="info-row"><span>${d.deviceType}</span><span>${uaData.mobile || '—'}</span></div>
                    <div class="info-row"><span>${d.fullUA}</span><span style="font-size:0.7rem;word-break:break-all;">${uaData.fullUA || '—'}</span></div>
                    <div class="info-row"><span>${d.lang}</span><span>${navigator.language || '—'}</span></div>
                    <div class="info-row"><span>${d.scr}</span><span>${screen.width}×${screen.height}</span></div>
                    <div class="info-row"><span>${d.vp}</span><span>${window.innerWidth}×${window.innerHeight}</span></div>
                    <div class="info-row"><span>${d.net}</span><span>${networkType}</span></div>
                    <div class="info-row"><span>${d.online}</span><span>${online ? d.onlineYes : d.onlineNo}</span></div>
                    <div class="info-row"><span>${d.timeNow}</span><span id="liveTime">${timeStr}</span></div>
                `;
                srvContent.innerHTML = `<div class="info-row"><span>${d.status}</span><span>${d.unknown}</span></div>`;
            }

            function updateLiveTime() {
                if (!detailModal.classList.contains('active')) return;
                const liveTime = document.getElementById('liveTime');
                if (liveTime) {
                    const now = new Date();
                    const timeStr = now.getFullYear() + '/' + 
                        (now.getMonth()+1).toString().padStart(2,'0') + '/' + 
                        now.getDate().toString().padStart(2,'0') + ' ' +
                        now.getHours().toString().padStart(2,'0') + ':' +
                        now.getMinutes().toString().padStart(2,'0') + ':' +
                        now.getSeconds().toString().padStart(2,'0');
                    liveTime.textContent = timeStr;
                }
            }

            let liveTimer;
            function openDetailModal() {
                detailModal.classList.add('active'); document.body.style.overflow = 'hidden';
                renderDetailModal(currentLang);
                if (liveTimer) clearInterval(liveTimer);
                liveTimer = setInterval(updateLiveTime, 1000);
            }
            function closeDetailModal() {
                detailModal.classList.remove('active'); document.body.style.overflow = '';
                if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
            }

            langFab.onclick = () => drawerOverlay.classList.contains('active') ? closeDrawer() : openDrawer();
            drawerClose.onclick = closeDrawer;
            drawerOverlay.onclick = (e) => { if (e.target === drawerOverlay) closeDrawer(); };
            detailFab.onclick = openDetailModal;
            modalClose.onclick = closeDetailModal;
            detailModal.onclick = (e) => { if (e.target === detailModal) closeDetailModal(); };
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (drawerOverlay.classList.contains('active')) closeDrawer();
                    else if (detailModal.classList.contains('active')) closeDetailModal();
                    else if (contactModal.classList.contains('active')) { contactModal.classList.remove('active'); document.body.style.overflow = ''; }
                }
            });

            const loadMessages = [
                '正在连接信息服务器',
                '正在获取维护公告',
                '正在验证公告有效性',
                '正在检查网络状态',
                '正在加载必要资源',
                '正在初始化界面组件',
                '正在进行安全校验',
                '即将完成'
            ];
            let loadTimer;
            function startLoading() {
                const totalDuration = Math.floor(Math.random() * 2000) + 3000;
                const startTime = Date.now();
                let progress = 0;
                loadingMessage.textContent = loadMessages[0];
                progressFill.style.width = '0%';
                progressPercent.textContent = '0%';
                let lastIndex = 0;

                const interval = setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    if (!navigator.onLine) {
                        clearInterval(interval);
                        loadingNormal.style.display = 'none';
                        loadingError.style.display = 'block';
                        return;
                    }
                    if (elapsed >= totalDuration) {
                        clearInterval(interval);
                        progress = 100;
                        progressFill.style.width = '100%';
                        progressPercent.textContent = '100%';
                        loadingMessage.textContent = '加载完成';
                        setTimeout(() => {
                            loadingOverlay.style.display = 'none';
                            pageWrapper.style.display = 'block';
                            updateUI(currentLang);
                        }, 300);
                        return;
                    }
                    const remaining = totalDuration - elapsed;
                    const maxIncrement = Math.min(35, (100 - progress) * (200 / remaining));
                    const increment = Math.random() * maxIncrement + 1;
                    progress = Math.min(99, progress + increment);
                    progressFill.style.width = progress + '%';
                    progressPercent.textContent = Math.floor(progress) + '%';

                    const msgIndex = Math.min(loadMessages.length - 1, Math.floor(progress / (100 / loadMessages.length)));
                    if (msgIndex !== lastIndex && msgIndex < loadMessages.length) {
                        loadingMessage.textContent = loadMessages[msgIndex];
                        lastIndex = msgIndex;
                    }
                }, 200);
                loadTimer = interval;
            }

            function handleOffline() {
                if (loadTimer) clearInterval(loadTimer);
                loadingNormal.style.display = 'none';
                loadingError.style.display = 'block';
                pageWrapper.style.display = 'none';
            }

            window.addEventListener('offline', handleOffline);
            if (!navigator.onLine) { handleOffline(); } else { startLoading(); }

            function init() {
                buildDrawer();
                const saved = (() => { try { return localStorage.getItem('preferred-language'); } catch(e) { return null; } })();
                const browser = navigator.language || '';
                let def = 'zh-CN';
                if (saved && langOrder.includes(saved)) def = saved;
                else if (browser === 'zh-TW' || browser.startsWith('zh-Hant')) def = 'zh-CN';
                else if (browser.startsWith('zh')) def = 'zh-CN';
                else if (langOrder.includes(browser)) def = browser;
                else { const base = browser.split('-')[0]; if (langOrder.includes(base)) def = base; }
                currentLang = def;
            }
            init();
        })();
    </script>
</body>
</html>
