<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>服务器维护公告</title>
    <style>
        @font-face {
            font-family: 'NeuBZ';
            src: url('neu_bz_s92.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg: #f5f5f5;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-primary: #1a1a1a;
            --text-secondary: #4a4a4a;
            --text-muted: #7a7a7a;
            --accent: #3a3a3a;
            --border: #d0d0d0;
            --shadow-card: 0 15px 30px rgba(0, 0, 0, 0.05);
            --banner-bg: rgba(250, 250, 250, 0.75);
            --banner-border: rgba(180, 180, 180, 0.6);
            --banner-text: #2a2a2a;
            --footer-text: #8a8a8a;
            --info-item-border: rgba(0,0,0,0.05);
            --divider: rgba(0,0,0,0.05);
            --empty-value: #b0b0b0;
            --gradient-start: #fafafa;
            --gradient-end: #e0e0e0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --card-bg: rgba(30, 30, 30, 0.9);
                --text-primary: #e0e0e0;
                --text-secondary: #b0b0b0;
                --text-muted: #808080;
                --accent: #d0d0d0;
                --border: #3a3a3a;
                --shadow-card: 0 15px 30px rgba(0, 0, 0, 0.3);
                --banner-bg: rgba(25, 25, 25, 0.8);
                --banner-border: rgba(80, 80, 80, 0.3);
                --banner-text: #c0c0c0;
                --footer-text: #707070;
                --info-item-border: rgba(255,255,255,0.05);
                --divider: rgba(255,255,255,0.05);
                --empty-value: #606060;
                --gradient-start: #1a1a1a;
                --gradient-end: #101010;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'NeuBZ', sans-serif;
            font-weight: 700;
            background: radial-gradient(circle at 30% 10%, var(--gradient-start) 0%, var(--bg) 60%, var(--gradient-end) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        @media print { body { display: none; } }

        .page-wrapper { width: 100%; max-width: 580px; }

        .update-banner {
            background: var(--banner-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--banner-border); border-left: 4px solid var(--accent);
            border-radius: 10px; padding: 10px 16px; margin-bottom: 12px;
            font-size: 0.82rem; color: var(--banner-text);
            display: flex; align-items: center; gap: 10px;
            overflow: hidden; white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .banner-dot {
            width: 8px; height: 8px; background: var(--accent);
            border-radius: 50%; box-shadow: 0 0 0 4px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        .banner-text-container { overflow: hidden; flex: 1; }
        .banner-text-inner { display: inline-block; animation: scrollBanner 14s linear infinite; padding-left: 100%; }
        @keyframes scrollBanner { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        .main-card {
            background: var(--card-bg); backdrop-filter: blur(18px); border-radius: 22px;
            box-shadow: var(--shadow-card); overflow: hidden;
            border: 1px solid var(--border);
        }
        .card-accent-bar { height: 3px; background: linear-gradient(90deg, var(--accent) 0%, #666 50%, var(--accent) 100%); }
        .card-body { padding: 24px 28px 22px; }

        .header-section { text-align: center; margin-bottom: 20px; }
        .main-title { font-size: 1.5rem; font-weight: 700; }

        .info-list { list-style: none; }
        .info-item {
            padding: 12px 10px;
            transition: background 0.2s;
        }
        .info-item:hover { background: rgba(0,0,0,0.02); }
        .info-item+.info-item { border-top: 1px solid var(--info-item-border); }
        .info-item-label {
            font-size: 0.7rem; font-weight: 700; color: var(--text-muted);
            letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px;
        }
        .info-item-value { font-size: 0.92rem; font-weight: 600; word-break: break-word; }
        .empty-value { color: var(--empty-value); font-style: italic; font-weight: 500; }

        /* 统一的分割线，与列表项之间的边框完全一致 */
        .divider {
            border: none;
            border-top: 1px solid var(--divider);
            margin: 0;
        }

        .footer-note {
            text-align: center; margin-top: 20px; font-size: 0.65rem;
            color: var(--footer-text); letter-spacing: 0.04em;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .card-body { padding: 20px 18px 18px; }
            .main-title { font-size: 1.4rem; }
            .update-banner { font-size: 0.78rem; padding: 8px 14px; }
            .info-item-value { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="update-banner">
            <span class="banner-dot"></span>
            <div class="banner-text-container">
                <span class="banner-text-inner" id="bannerText"></span>
            </div>
        </div>

        <div class="main-card">
            <div class="card-accent-bar"></div>
            <div class="card-body">
                <div class="header-section">
                    <h1 class="main-title">服务器维护公告</h1>
                </div>
                <ul class="info-list">
                    <li class="info-item">
                        <div class="info-item-label">维护对象</div>
                        <div class="info-item-value">测试32线_CN-TW_lvka</div>
                    </li>
                    <li class="info-item">
                        <div class="info-item-label">维护时间</div>
                        <div class="info-item-value" id="valueTime"></div>
                    </li>
                    <li class="info-item">
                        <div class="info-item-label">维护影响</div>
                        <div class="info-item-value empty-value">——</div>
                    </li>
                    <hr class="divider">
                    <li class="info-item">
                        <div class="info-item-label">维护内容</div>
                        <div class="info-item-value empty-value">——</div>
                    </li>
                    <li class="info-item">
                        <div class="info-item-label">维护补偿</div>
                        <div class="info-item-value empty-value">——</div>
                    </li>
                </ul>
            </div>
        </div>
        <div class="footer-note">本网页由DeepSeek自动生成。</div>
    </div>

    <script>
        (function() {
            history.pushState(null, '', location.href);
            window.addEventListener('popstate', function(e) { history.pushState(null, '', location.href); });
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('selectstart', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) || (e.ctrlKey && e.key === 'U') || (e.ctrlKey && e.shiftKey && e.key === 'C') || (e.ctrlKey && e.key === 'p') || (e.ctrlKey && e.shiftKey && e.key === 'S')) {
                    e.preventDefault();
                }
            });

            function getDateForAnnouncement() {
                const now = new Date();
                const today7am = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 7, 0, 0);
                return now >= today7am ? now : new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
            }

            function pad(n) { return n.toString().padStart(2, '0'); }

            function updateDisplay() {
                const announcementDate = getDateForAnnouncement();
                const year = announcementDate.getFullYear();
                const month = announcementDate.getMonth() + 1;
                const day = announcementDate.getDate();

                document.getElementById('bannerText').innerHTML = `本网页由系统自动更新于 <strong>${year}/${pad(month)}/${pad(day)} 07:00</strong>，请注意公告内容的有效期限。`;
                document.getElementById('valueTime').innerHTML = `${year}年${month}月${day}日 07:00 &nbsp;～&nbsp; ${month}月${day}日 17:35 （UTC+8，预计）`;
            }

            updateDisplay();
        })();
    </script>
</body>
</html>
