<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>服务器维护公告</title>
    <style>
        @font-face {
            font-family: 'NeuBZ';
            src: url('neu_bz_s92.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg: #f5f5f5;
            --gradient-mid: #e8e8e8;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.06);
            --text-primary: #1a1a1a;
            --text-secondary: #4a4a4a;
            --text-muted: #7a7a7a;
            --accent: #3a3a3a;
            --accent-soft: rgba(0, 0, 0, 0.06);
            --border: #d0d0d0;
            --shadow-card: 0 15px 30px rgba(0, 0, 0, 0.05);
            --shadow-banner: 0 1px 8px rgba(0,0,0,0.04);
            --banner-bg: rgba(250, 250, 250, 0.75);
            --banner-border: rgba(180, 180, 180, 0.6);
            --banner-text: #2a2a2a;
            --contact-text: #4a4a4a;
            --contact-link: #1a1a1a;
            --footer-text: #8a8a8a;
            --modal-bg: rgba(255, 255, 255, 0.96);
            --modal-row-border: rgba(0,0,0,0.05);
            --toast-bg: #1a1a1a;
            --toast-text: #f5f5f5;
            --info-item-border: rgba(0,0,0,0.05);
            --divider: #d5d5d5;
            --empty-value: #b0b0b0;
            --particle-color: rgba(0, 0, 0, 0.08);
            --gradient-start: #fafafa;
            --gradient-end: #e0e0e0;
            --circle1-color: rgba(0, 0, 0, 0.04);
            --circle2-color: rgba(0, 0, 0, 0.03);
            --circle3-color: rgba(0, 0, 0, 0.02);
            --loading-bg: #f0f0f0;
            --loading-text: #2a2a2a;
            --progress-bg: #d0d0d0;
            --progress-fill: #3a3a3a;
            --link-color: #1a1a1a;
            --link-hover: #5a5a5a;
            --input-bg: rgba(255,255,255,0.8);
            --input-border: #c0c0c0;
            --social-btn-bg: rgba(0,0,0,0.04);
            --social-btn-hover: rgba(0,0,0,0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --gradient-mid: #1e1e1e;
                --card-bg: rgba(30, 30, 30, 0.9);
                --card-border: rgba(255, 255, 255, 0.08);
                --text-primary: #e0e0e0;
                --text-secondary: #b0b0b0;
                --text-muted: #808080;
                --accent: #d0d0d0;
                --accent-soft: rgba(255, 255, 255, 0.08);
                --border: #3a3a3a;
                --shadow-card: 0 15px 30px rgba(0, 0, 0, 0.3);
                --shadow-banner: 0 1px 8px rgba(0,0,0,0.2);
                --banner-bg: rgba(25, 25, 25, 0.8);
                --banner-border: rgba(80, 80, 80, 0.3);
                --banner-text: #c0c0c0;
                --contact-text: #b0b0b0;
                --contact-link: #d0d0d0;
                --footer-text: #707070;
                --modal-bg: rgba(25, 25, 25, 0.96);
                --modal-row-border: rgba(255,255,255,0.06);
                --toast-bg: #2a2a2a;
                --toast-text: #e0e0e0;
                --info-item-border: rgba(255,255,255,0.05);
                --divider: #3a3a3a;
                --empty-value: #606060;
                --particle-color: rgba(255, 255, 255, 0.06);
                --gradient-start: #1a1a1a;
                --gradient-end: #101010;
                --circle1-color: rgba(255, 255, 255, 0.04);
                --circle2-color: rgba(255, 255, 255, 0.03);
                --circle3-color: rgba(255, 255, 255, 0.02);
                --loading-bg: #1a1a1a;
                --loading-text: #c0c0c0;
                --progress-bg: #3a3a3a;
                --progress-fill: #d0d0d0;
                --link-color: #d0d0d0;
                --link-hover: #ffffff;
                --input-bg: rgba(40,40,40,0.8);
                --input-border: #5a5a5a;
                --social-btn-bg: rgba(255,255,255,0.06);
                --social-btn-hover: rgba(255,255,255,0.12);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'NeuBZ', sans-serif;
            font-weight: 700;
            background: radial-gradient(circle at 30% 10%, var(--gradient-start) 0%, var(--gradient-mid) 60%, var(--gradient-end) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        @media print { body { display: none; } }

        .bg-decoration { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
        .circle-1 { width: 600px; height: 600px; background: radial-gradient(circle, var(--circle1-color) 0%, transparent 70%); top: -250px; right: -200px; }
        .circle-2 { width: 500px; height: 500px; background: radial-gradient(circle, var(--circle2-color) 0%, transparent 70%); bottom: -240px; left: -160px; }
        .circle-3 { width: 350px; height: 350px; background: radial-gradient(circle, var(--circle3-color) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); animation: float 8s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.08); } }

        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .particle { position: absolute; background: var(--particle-color); border-radius: 50%; animation: rise 10s infinite; bottom: -40px; }
        .particle:nth-child(1) { left: 10%; width: 5px; height: 5px; animation-duration: 9s; }
        .particle:nth-child(2) { left: 25%; width: 7px; height: 7px; animation-duration: 12s; animation-delay: 2s; }
        .particle:nth-child(3) { left: 45%; width: 4px; height: 4px; animation-duration: 8s; animation-delay: 4s; }
        .particle:nth-child(4) { left: 65%; width: 8px; height: 8px; animation-duration: 11s; animation-delay: 1s; }
        .particle:nth-child(5) { left: 80%; width: 6px; height: 6px; animation-duration: 10s; animation-delay: 3s; }
        @keyframes rise { 0% { transform: translateY(0) scale(0); opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.6; } 100% { transform: translateY(-110vh) scale(1.3); opacity: 0; } }

        #loadingOverlay {
            position: fixed; inset: 0; background: var(--loading-bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 1rem; font-weight: 700; color: var(--loading-text); letter-spacing: 0.05em; gap: 24px;
        }
        #loadingError { display: none; text-align: center; color: #d44; }
        .progress-container { width: 200px; height: 6px; background: var(--progress-bg); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--progress-fill); transition: width 0.3s; }

        .page-wrapper { position: relative; z-index: 2; width: 100%; max-width: 580px; animation: fadeInUp 0.5s ease-out; display: none; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .update-banner {
            background: var(--banner-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--banner-border); border-left: 4px solid var(--accent);
            border-radius: 10px; padding: 10px 16px; margin-bottom: 12px;
            font-size: 0.82rem; color: var(--banner-text); box-shadow: var(--shadow-banner);
            display: flex; align-items: center; gap: 10px;
            overflow: hidden; white-space: nowrap;
        }
        .banner-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 0 4px rgba(0,0,0,0.1); flex-shrink: 0; }
        .banner-text-container { overflow: hidden; flex: 1; }
        .banner-text-inner { display: inline-block; animation: scrollBanner 12s linear infinite; padding-left: 100%; }
        @keyframes scrollBanner { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        .main-card { background: var(--card-bg); backdrop-filter: blur(18px); border-radius: 22px; box-shadow: var(--shadow-card); overflow: hidden; border: 1px solid var(--card-border); }
        .card-accent-bar { height: 3px; background: linear-gradient(90deg, var(--accent) 0%, #666 50%, var(--accent) 100%); }
        .card-body { padding: 24px 28px 22px; }

        .header-section { text-align: center; margin-bottom: 20px; }
        .main-title { font-size: 1.5rem; font-weight: 700; }

        .info-list { list-style: none; }
        .info-item { padding: 12px 10px; transition: background 0.2s; }
        .info-item:hover { background: rgba(0,0,0,0.02); }
        .info-item:active { background: transparent; }
        .info-item+.info-item { border-top: 1px solid var(--info-item-border); }
        .info-item-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
        .info-item-value { font-size: 0.92rem; font-weight: 600; word-break: break-word; }
        .empty-value { color: var(--empty-value); font-style: italic; font-weight: 500; }

        .contact-section { text-align: center; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--info-item-border); font-size: 0.88rem; color: var(--contact-text); }
        .contact-link { color: var(--contact-link); text-decoration: underline; cursor: pointer; font-weight: 700; }
        .contact-link:hover { color: var(--accent); }

        .footer-note { text-align: center; margin-top: 20px; font-size: 0.65rem; color: var(--footer-text); letter-spacing: 0.04em; }

        .bottom-links {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 18px;
            z-index: 1000;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            padding: 8px 20px;
            border-radius: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        .text-link {
            background: none;
            border: none;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--link-color);
            cursor: pointer;
            transition: color 0.2s;
            letter-spacing: 0.03em;
            text-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .text-link:hover { color: var(--link-hover); }
        .text-link:active { opacity: 0.7; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); z-index: 3000; opacity: 0; pointer-events: none; transition: opacity 0.25s; display: flex; align-items: center; justify-content: center; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box { background: var(--modal-bg); backdrop-filter: blur(25px); border-radius: 26px; width: 92%; max-width: 480px; max-height: 85vh; overflow-y: auto; box-shadow: 0 30px 60px rgba(0,0,0,0.15); padding: 24px 22px; animation: modalPop 0.25s ease-out; }
        @keyframes modalPop { from { transform: scale(0.93); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .modal-title { font-size: 1.2rem; font-weight: 700; }
        .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: inherit; }
        .info-block { margin-bottom: 20px; }
        .info-block h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 10px; font-weight: 700; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--modal-row-border); font-size: 0.85rem; }
        .info-row span:first-child { color: var(--text-secondary); font-weight: 600; white-space: nowrap; }
        .info-row span:last-child { font-weight: 700; color: var(--text-primary); text-align: right; }

        .lang-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .lang-list button {
            width: 100%; text-align: left; padding: 12px 18px; border-radius: 12px;
            font-size: 0.95rem; font-weight: 600; background: transparent;
            border: 1px solid transparent; cursor: pointer; color: var(--text-primary);
            transition: all 0.2s; font-family: inherit;
            display: flex; align-items: center; gap: 8px;
        }
        .lang-list button:hover { background: var(--accent-soft); border-color: rgba(0,0,0,0.1); }
        .lang-list button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
        .lang-flag { font-size: 1.2rem; }

        .login-form { display: flex; flex-direction: column; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }
        .form-input {
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-primary);
            outline: none;
            transition: border 0.2s;
        }
        .form-input:focus { border-color: var(--accent); }
        .social-buttons { display: flex; gap: 10px; margin-top: 8px; }
        .social-btn {
            flex: 1; padding: 10px 6px; border-radius: 12px;
            border: 1px solid var(--input-border);
            background: var(--social-btn-bg);
            font-family: inherit; font-size: 0.8rem; font-weight: 600;
            cursor: pointer; text-align: center; color: var(--text-primary);
            transition: background 0.2s;
            display: flex; align-items: center; justify-content: center;
            gap: 4px;
        }
        .social-btn:hover { background: var(--social-btn-hover); }
        .social-logo {
            width: 16px; height: 16px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 0.6rem; font-weight: 700; background: #555; color: #fff;
        }
        .login-error { color: #d44; font-size: 0.85rem; font-weight: 600; margin-top: 6px; }

        .toast-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 4000; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
        .toast-overlay.active { opacity: 1; pointer-events: auto; }
        .toast-box { background: var(--toast-bg); color: var(--toast-text); padding: 14px 28px; border-radius: 12px; font-size: 0.88rem; font-weight: 600; text-align: center; max-width: 85vw; box-shadow: 0 20px 50px rgba(0,0,0,0.3); animation: toastIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(18px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .card-body { padding: 20px 18px 18px; }
            .bottom-links { gap: 14px; padding: 6px 16px; }
            .text-link { font-size: 0.8rem; }
            .main-title { font-size: 1.4rem; }
            .update-banner { font-size: 0.78rem; padding: 8px 14px; }
            .info-item-value { font-size: 0.85rem; }
            .modal-box { padding: 20px 16px; }
        }
    </style>
</head>
<body>
    <div id="loadingOverlay">
        <div id="loadingNormal">
            <div id="loadingMessage" style="margin-bottom:16px;">正在准备</div>
            <div class="progress-container"><div class="progress-fill" id="progressFill"></div></div>
            <div style="margin-top:12px; font-size:0.9rem;" id="progressPercent">0%</div>
        </div>
        <div id="loadingError"><p>网络连接已断开</p><p>请检查网络后刷新页面</p></div>
    </div>

    <div class="bg-decoration circle-1"></div><div class="bg-decoration circle-2"></div><div class="bg-decoration circle-3"></div>
    <div class="particles"><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div></div>

    <div class="page-wrapper" id="pageWrapper">
        <div class="update-banner" id="updateBanner">
            <span class="banner-dot"></span>
            <div class="banner-text-container"><span class="banner-text-inner" id="bannerText"></span></div>
        </div>
        <div class="main-card">
            <div class="card-accent-bar"></div>
            <div class="card-body">
                <div class="header-section"><h1 class="main-title" id="mainTitle">服务器维护公告</h1></div>
                <ul class="info-list">
                    <li class="info-item"><div class="info-item-label" id="labelTarget">维护对象</div><div class="info-item-value">测试32线_CN-TW_lvka</div></li>
                    <li class="info-item"><div class="info-item-label" id="labelTime">维护时间</div><div class="info-item-value" id="valueTime"></div></li>
                    <li class="info-item"><div class="info-item-label" id="labelImpact">维护影响</div><div class="info-item-value empty-value" id="valueImpact">——</div></li>
                    <li class="info-item"><div class="info-item-label" id="labelContent">维护内容</div><div class="info-item-value empty-value" id="valueContent">——</div></li>
                    <li class="info-item"><div class="info-item-label" id="labelCompensation">维护补偿</div><div class="info-item-value empty-value" id="valueCompensation">——</div></li>
                </ul>
                <div class="contact-section" id="contactSection"><span>若对该公告内容有疑问，请</span><span class="contact-link" id="contactLink">单击此处</span><span>联系客服。</span></div>
            </div>
        </div>
        <div class="footer-note" id="footerNote">本网页由DeepSeek自动生成。</div>
    </div>

    <div class="bottom-links">
        <button class="text-link" id="btnLang">语言</button>
        <button class="text-link" id="btnDetail">详情</button>
        <button class="text-link" id="btnLogin">登录</button>
        <button class="text-link" id="btnService">客服</button>
    </div>

    <div class="modal-overlay" id="langModal">
        <div class="modal-box">
            <div class="modal-header"><span class="modal-title">选择语言</span><button class="modal-close" id="langModalClose">✕</button></div>
            <div class="lang-list" id="langListContainer"></div>
        </div>
    </div>

    <div class="modal-overlay" id="detailModal">
        <div class="modal-box">
            <div class="modal-header"><span class="modal-title" id="detailTitle">设备与服务器详情</span><button class="modal-close" id="detailModalClose">✕</button></div>
            <div class="info-block"><h3 id="deviceInfoHeading">设备信息</h3><div id="deviceInfoContent"></div></div>
            <div class="info-block"><h3 id="serverStatusHeading">服务器状态</h3><div id="serverStatusContent"></div></div>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <div class="modal-header"><span class="modal-title">登录</span><button class="modal-close" id="loginModalClose">✕</button></div>
            <div class="login-form">
                <div class="form-group">
                    <label>通行证</label>
                    <input type="text" class="form-input" id="loginUsername" placeholder="请输入通行证" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>通行码</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="请输入通行码" autocomplete="off">
                </div>
                <div class="login-error" id="loginError"></div>
                <button class="social-btn" id="loginSubmit" style="background:var(--accent);color:#fff;border:none;">登录</button>
                <div style="text-align:center;font-size:0.8rem;color:var(--text-muted);margin:8px 0;">或通过以下方式登录</div>
                <div class="social-buttons">
                    <button class="social-btn" id="googleLogin"><span class="social-logo" style="background:#555;color:#fff;">G</span> Google</button>
                    <button class="social-btn" id="facebookLogin"><span class="social-logo" style="background:#3b5998;color:#fff;">f</span> Facebook</button>
                    <button class="social-btn" id="xLogin"><span class="social-logo" style="background:#000;color:#fff;">X</span> X</button>
                </div>
            </div>

    </div>

    <div class="modal-overlay" id="serviceModal">
        <div class="modal-box">
            <div class="modal-header"><span class="modal-title">客服</span><button class="modal-close" id="serviceModalClose">✕</button></div>
            <div style="padding:10px 0;font-size:0.95rem;color:var(--text-primary);"><p>该服务不是由我们提供的，详情请联系您的组织的管理员LVKA。</p></div>
        </div>
    </div>

    <div class="toast-overlay" id="toastOverlay"><div class="toast-box" id="toastBox"></div></div>

    <script>
        (function() {
            history.pushState(null, '', location.href);
            window.addEventListener('popstate', function(e) { history.pushState(null, '', location.href); });
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('selectstart', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) || (e.ctrlKey && e.key === 'U') || (e.ctrlKey && e.shiftKey && e.key === 'C') || (e.ctrlKey && e.key === 'p') || (e.ctrlKey && e.shiftKey && e.key === 'S')) {
                    e.preventDefault();
                }
            });

            const i18n = {
                'zh-CN': {
                    langLabel: '🇨🇳 简体中文', flag: '🇨🇳',
                    title: '服务器维护公告',
                    target: '维护对象', time: '维护时间', impact: '维护影响',
                    impactVal: '——', content: '维护内容', comp: '维护补偿', dash: '——',

            const langOrder = ['zh-CN', 'zh-TW', 'en-US', 'en-GB'];
            function getLangData(lang) { return i18n[lang] || i18n['zh-CN']; }

            function getDateForAnnouncement() {
                const now = new Date();
                const today830 = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 8, 47, 0);
                return now >= today830 ? now : new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
            }

            function getDynamicDateStrings() {
                const announcementDate = getDateForAnnouncement();
                const year = announcementDate.getFullYear();
                const month = announcementDate.getMonth() + 1;
                const day = announcementDate.getDate();
                const pad = (n) => n.toString().padStart(2, '0');
                const bannerStr = `本网页由系统自动更新于 <strong>${year}/${pad(month)}/${pad(day)} 08:47</strong>，请注意公告内容的有效期限。`;
                const timeStr = `${year}年${month}月${day}日 08:45 &nbsp;～&nbsp; ${month}月${day}日 17:35 （UTC+8，预计）`;
                return { bannerStr, timeStr };
            }

            let currentLang = 'zh-CN';
            const $ = (id) => document.getElementById(id);
            const bannerText = $('bannerText'), mainTitle = $('mainTitle'), valueTime = $('valueTime');
            const contactSection = $('contactSection'), toastBox = $('toastBox'), toastOverlay = $('toastOverlay');
            const footerNote = $('footerNote');
            const pageWrapper = $('pageWrapper');
            const loadingOverlay = $('loadingOverlay'), loadingNormal = $('loadingNormal'), loadingError = $('loadingError');
            const loadingMessage = $('loadingMessage'), progressFill = $('progressFill'), progressPercent = $('progressPercent');

            const langModal = $('langModal'), langListContainer = $('langListContainer'), langModalClose = $('langModalClose');
            const detailModal = $('detailModal'), detailModalClose = $('detailModalClose'), detailTitle = $('detailTitle');
            const devHead = $('deviceInfoHeading'), srvHead = $('serverStatusHeading'), devContent = $('deviceInfoContent'), srvContent = $('serverStatusContent');
            const loginModal = $('loginModal'), loginModalClose = $('loginModalClose');
            const serviceModal = $('serviceModal'), serviceModalClose = $('serviceModalClose');

            function closeAllModals() {
                [langModal, detailModal, loginModal, serviceModal].forEach(m => m.classList.remove('active'));
                document.body.style.overflow = '';
            }

            function openModal(modal) {
                closeAllModals();
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function buildLangList() {
                langListContainer.innerHTML = '';
                langOrder.forEach(lang => {
                    const d = getLangData(lang);
                    const btn = document.createElement('button');
                    btn.innerHTML = `<span class="lang-flag">${d.flag}</span> ${d.langLabel.replace(d.flag+' ','')}`;
                    btn.className = lang === currentLang ? 'active' : '';
                    btn.onclick = () => {
                        if (lang === currentLang) {
                            showToast(d.alreadyLang);
                            closeAllModals();
                        } else {
                            currentLang = lang;
                            updateUI(lang);
                            try { localStorage.setItem('preferred-language', lang); } catch(e) {}
                            closeAllModals();
                        }
                    };
                    langListContainer.appendChild(btn);
                });
            }

            function updateUI(lang) {
                const d = getLangData(lang);
                const dynamic = getDynamicDateStrings();
                bannerText.innerHTML = dynamic.bannerStr;
                valueTime.innerHTML = dynamic.timeStr;
                mainTitle.textContent = d.title;
                document.title = d.title;
                document.getElementById('labelTarget').textContent = d.target;
                document.getElementById('labelTime').textContent = d.time;
                document.getElementById('labelImpact').textContent = d.impact;
                document.getElementById('valueImpact').textContent = d.impactVal;
                document.getElementById('labelContent').textContent = d.content;
                document.getElementById('valueContent').textContent = d.dash;
                document.getElementById('labelCompensation').textContent = d.comp;
                document.getElementById('valueCompensation').textContent = d.dash;
                contactSection.innerHTML = d.contact;
                toastBox.textContent = d.toast;
                footerNote.textContent = d.footer;
                detailTitle.textContent = d.detailTitle;
                devHead.textContent = d.devHead;
                srvHead.textContent = d.srvHead;
                document.documentElement.lang = lang;
                document.documentElement.dir = 'ltr';
                // 更新底部按钮文字
                $('btnLang').textContent = d.langBtn;
                $('btnDetail').textContent = d.detailBtn;
                $('btnLogin').textContent = d.loginBtn;
                $('btnService').textContent = d.serviceBtn;
                rebindContact();
                buildLangList();
                if (detailModal.classList.contains('active')) renderDetailModal(lang);
            }

            function rebindContact() {
                const link = document.getElementById('contactLink');
                if (link) {
                    link.onclick = (e) => {
                        e.preventDefault();
                        openModal(serviceModal);
                    };
                }
            }

            function showToast(msg) {
                toastBox.textContent = msg;
                toastOverlay.classList.add('active');
                clearTimeout(toastOverlay._timeout);
                toastOverlay._timeout = setTimeout(() => toastOverlay.classList.remove('active'), 2000);
            }

            function parseUserAgent() {
                const ua = navigator.userAgent || '';
                const data = {};
                data.fullUA = ua;
                if (navigator.userAgentData) {
                    const brands = navigator.userAgentData.brands;
                    if (brands && brands.length) { data.browserName = brands[0].brand; data.browserVersion = brands[0].version; }
                    data.platform = navigator.userAgentData.platform;
                    data.mobile = navigator.userAgentData.mobile ? '移动端' : '桌面端';
                    data.engine = '—';
                } else {
                    const uaLower = ua.toLowerCase();
                    if (uaLower.includes('edg')) { data.browserName = 'Edge'; data.browserVersion = (ua.match(/edg\/([\d.]+)/i) || [])[1] || ''; }
                    else if (uaLower.includes('chrome') && !uaLower.includes('edg')) { data.browserName = 'Chrome'; data.browserVersion = (ua.match(/chrome\/([\d.]+)/i) || [])[1] || ''; }
                    else if (uaLower.includes('safari') && !uaLower.includes('chrome')) { data.browserName = 'Safari'; data.browserVersion = (ua.match(/version\/([\d.]+)/i) || [])[1] || ''; }
                    else if (uaLower.includes('firefox')) { data.browserName = 'Firefox'; data.browserVersion = (ua.match(/firefox\/([\d.]+)/i) || [])[1] || ''; }
                    else { data.browserName = 'Unknown'; data.browserVersion = ''; }
                    if (uaLower.includes('webkit')) data.engine = 'WebKit';
                    else if (uaLower.includes('gecko') && !uaLower.includes('webkit')) data.engine = 'Gecko';
                    else if (uaLower.includes('trident')) data.engine = 'Trident';
                    else data.engine = '—';
                    const osMatch = ua.match(/\(([^)]+)\)/);
                    data.platform = osMatch ? osMatch[1] : (navigator.platform || 'Unknown');
                    data.mobile = /mobile|android|iphone|ipad|ipod/i.test(ua) ? '移动端' : '桌面端';
                }
                return data;
            }

            function renderDetailModal(lang) {
                const d = getLangData(lang);
                const online = navigator.onLine;
                const now = new Date();
                const timeStr = now.getFullYear() + '/' + (now.getMonth()+1).toString().padStart(2,'0') + '/' + now.getDate().toString().padStart(2,'0') + ' ' + now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0') + ':' + now.getSeconds().toString().padStart(2,'0');
                const networkType = navigator.connection?.effectiveType ? navigator.connection.effectiveType.toUpperCase() : 'UNKNOWN';
                const uaData = parseUserAgent();
                devContent.innerHTML = `
                    <div class="info-row"><span>${d.browserName}</span><span>${uaData.browserName || '—'}</span></div>
                    <div class="info-row"><span>${d.browserVersion}</span><span>${uaData.browserVersion || '—'}</span></div>
                    <div class="info-row"><span>${d.engine}</span><span>${uaData.engine || '—'}</span></div>
                    <div class="info-row"><span>${d.os}</span><span>${uaData.platform || '—'}</span></div>
                    <div class="info-row"><span>${d.deviceType}</span><span>${uaData.mobile || '—'}</span></div>
                    <div class="info-row"><span>${d.fullUA}</span><span style="font-size:0.7rem;word-break:break-all;">${uaData.fullUA || '—'}</span></div>
                    <div class="info-row"><span>${d.lang}</span><span>${navigator.language || '—'}</span></div>
                    <div class="info-row"><span>${d.scr}</span><span>${screen.width}×${screen.height}</span></div>
                    <div class="info-row"><span>${d.vp}</span><span>${window.innerWidth}×${window.innerHeight}</span></div>
                    <div class="info-row"><span>${d.net}</span><span>${networkType}</span></div>
                    <div class="info-row"><span>${d.online}</span><span>${online ? d.onlineYes : d.onlineNo}</span></div>
                    <div class="info-row"><span>${d.timeNow}</span><span id="liveTime">${timeStr}</span></div>
                `;
                srvContent.innerHTML = `<div class="info-row"><span>${d.status}</span><span>${d.unknown}</span></div>`;
            }

            function updateLiveTime() {
                if (!detailModal.classList.contains('active')) return;
                const liveTime = document.getElementById('liveTime');
                if (liveTime) {
                    const now = new Date();
                    liveTime.textContent = now.getFullYear() + '/' + (now.getMonth()+1).toString().padStart(2,'0') + '/' + now.getDate().toString().padStart(2,'0') + ' ' + now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0') + ':' + now.getSeconds().toString().padStart(2,'0');
                }
            }

            let liveTimer;
            function openDetailModal() { openModal(detailModal); renderDetailModal(currentLang); if(liveTimer) clearInterval(liveTimer); liveTimer = setInterval(updateLiveTime, 1000); }
            function closeDetailModal() { detailModal.classList.remove('active'); document.body.style.overflow = ''; if(liveTimer) { clearInterval(liveTimer); liveTimer = null; } }

            function setupLoginModal() {
                const d = getLangData(currentLang);
                const submitBtn = document.getElementById('loginSubmit');
                const googleBtn = document.getElementById('googleLogin');
                const facebookBtn = document.getElementById('facebookLogin');
                const xBtn = document.getElementById('xLogin');
                const errorEl = document.getElementById('loginError');
                submitBtn.onclick = (e) => {
                    e.preventDefault();
                    const password = document.getElementById('loginPassword').value;
                    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~`])[A-Za-z\d!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~`]{8,24}$/;
                    errorEl.textContent = passwordRegex.test(password) ? d.loginFail : d.passwordInvalid;
                };
                googleBtn.onclick = () => { errorEl.textContent = d.loginFail; };
                facebookBtn.onclick = () => { errorEl.textContent = d.loginFail; };
                xBtn.onclick = () => { errorEl.textContent = d.loginFail; };
            }

            $('btnLang').onclick = () => openModal(langModal);
            $('btnDetail').onclick = openDetailModal;
            $('btnLogin').onclick = () => { openModal(loginModal); setupLoginModal(); };
            $('btnService').onclick = () => openModal(serviceModal);

            langModalClose.onclick = () => { langModal.classList.remove('active'); document.body.style.overflow = ''; };
            detailModalClose.onclick = closeDetailModal;
            loginModalClose.onclick = () => { loginModal.classList.remove('active'); document.body.style.overflow = ''; };
            serviceModalClose.onclick = () => { serviceModal.classList.remove('active'); document.body.style.overflow = ''; };

            [langModal, detailModal, loginModal, serviceModal].forEach(modal => {
                modal.addEventListener('click', (e) => { if (e.target === modal) { modal.classList.remove('active'); document.body.style.overflow = ''; } });
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeAllModals();
            });

            const loadMessages = ['正在连接信息服务器','正在获取维护公告','正在验证公告有效性','正在检查网络状态','正在加载必要资源','正在初始化界面组件','正在进行安全校验','即将完成'];
            let loadTimer;
            function startLoading() {
                const totalDuration = Math.floor(Math.random() * 2000) + 3000;
                const startTime = Date.now();
                let progress = 0;
                loadingMessage.textContent = loadMessages[0];
                progressFill.style.width = '0%'; progressPercent.textContent = '0%';
                let lastIndex = 0;
                const interval = setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    if (!navigator.onLine) { clearInterval(interval); loadingNormal.style.display = 'none'; loadingError.style.display = 'block'; return; }
                    if (elapsed >= totalDuration) {
                        clearInterval(interval);
                        progress = 100; progressFill.style.width = '100%'; progressPercent.textContent = '100%';
                        loadingMessage.textContent = '加载完成';
                        setTimeout(() => { loadingOverlay.style.display = 'none'; pageWrapper.style.display = 'block'; updateUI(currentLang); }, 300);
                        return;
                    }
                    const remaining = totalDuration - elapsed;
                    const maxIncrement = Math.min(35, (100 - progress) * (200 / remaining));
                    progress = Math.min(99, progress + Math.random() * maxIncrement + 1);
                    progressFill.style.width = progress + '%'; progressPercent.textContent = Math.floor(progress) + '%';
                    const msgIndex = Math.min(loadMessages.length-1, Math.floor(progress / (100/loadMessages.length)));
                    if (msgIndex !== lastIndex && msgIndex < loadMessages.length) { loadingMessage.textContent = loadMessages[msgIndex]; lastIndex = msgIndex; }
                }, 200);
                loadTimer = interval;
            }

            function handleOffline() { if(loadTimer) clearInterval(loadTimer); loadingNormal.style.display = 'none'; loadingError.style.display = 'block'; pageWrapper.style.display = 'none'; }
            window.addEventListener('offline', handleOffline);
            if (!navigator.onLine) { handleOffline(); } else { startLoading(); }

            function init() {
                buildLangList();
                const saved = (() => { try { return localStorage.getItem('preferred-language'); } catch(e) { return null; } })();
                const browser = navigator.language || '';
                let def = 'zh-CN';
                if (saved && langOrder.includes(saved)) def = saved;
                else if (browser.startsWith('zh-TW') || browser.startsWith('zh-Hant')) def = 'zh-TW';
                else if (browser.startsWith('zh')) def = 'zh-CN';
                else if (browser.startsWith('en-GB')) def = 'en-GB';
                else if (browser.startsWith('en')) def = 'en-US';
                else if (langOrder.includes(browser)) def = browser;
                currentLang = def;
            }
            init();
        })();
    </script>
